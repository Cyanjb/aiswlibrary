<!doctype html><html><head><meta charset="utf-8"><title>Data chart animation sample</title>
<style>html,body{margin:0;background:#f1ece1}canvas{display:block}</style></head>
<body><canvas id="c" width="1920" height="1080"></canvas>
<script>
/* Style sample for the "Data Chart Animation" keyword: a newsroom bar chart for a made-up company.
   draw(t) is a pure function of time (0 to 7 s), so render.mjs can step it frame by frame. */
const W = 960, H = 540, DUR = 7;
const C = { bg: '#f1ece1', ink: '#1d1b18', soft: '#6b655c', grid: '#d9d2c4', bar: '#2e5d63', grey: '#c9c2b6', red: '#c9382b' };
const DATA = [['2021', 20.1], ['2022', 27.4], ['2023', 31.0], ['2024', 52.8], ['2025', 92.4]];
const MAX = 100, TICKS = [0, 25, 50, 75, 100];
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const seg = (t, a, b) => clamp((t - a) / (b - a));
const out = p => 1 - Math.pow(1 - p, 3);
const inOut = p => (p < 0.5 ? 4 * p * p * p : 1 - Math.pow(-2 * p + 2, 3) / 2);
const mix = (a, b, p) => { const h = s => [1, 3, 5].map(i => parseInt(s.slice(i, i + 2), 16)); const x = h(a), y = h(b);
  return 'rgb(' + x.map((v, i) => Math.round(v + (y[i] - v) * p)).join(',') + ')'; };
const cv = document.getElementById('c'), ctx = cv.getContext('2d');
function txt(s, x, y, size, weight, color, align = 'left', alpha = 1) {
  ctx.globalAlpha = alpha; ctx.font = `${weight} ${size}px Inter, sans-serif`; ctx.fillStyle = color;
  ctx.textAlign = align; ctx.textBaseline = 'alphabetic'; ctx.fillText(s, x, y); ctx.globalAlpha = 1;
}
function draw(t) {
  ctx.setTransform(2, 0, 0, 2, 0, 0);
  ctx.fillStyle = C.bg; ctx.fillRect(0, 0, W, H);
  // top rule and kicker block
  ctx.fillStyle = C.red; ctx.fillRect(0, 0, W * out(seg(t, 0, 0.5)), 4);
  ctx.fillRect(45, 27, 48 * out(seg(t, 0.1, 0.45)), 9);
  const head = out(seg(t, 0.15, 0.6));
  txt('Lantern Coffee revenue grew 4.6×', 45, 74 + (1 - head) * 8, 29, 800, C.ink, 'left', head);
  txt('Annual revenue, $ millions (2021 to 2025)', 45, 102, 16, 400, C.soft, 'left', out(seg(t, 0.3, 0.75)));
  // plot area
  const L = 55, R = 905, B = 445, T = 128, ph = B - T;
  const y = v => B - (v / MAX) * ph;
  const gridP = out(seg(t, 0.35, 1.0));
  TICKS.forEach((v, i) => {
    ctx.globalAlpha = gridP; ctx.fillStyle = C.grid; if (v) ctx.fillRect(L, y(v), (R - L) * gridP, 1);
    txt(String(v), R, y(v) - 6, 13, 400, C.soft, 'right', gridP);
  });
  ctx.globalAlpha = 1; ctx.fillStyle = C.ink; ctx.fillRect(L, B, (R - L) * out(seg(t, 0.4, 0.95)), 2);
  // bars grow one after another, numbers count up with them
  const slot = (R - L) / DATA.length, bw = 76;
  const greyP = inOut(seg(t, 4.5, 5.1));
  DATA.forEach(([label, v], i) => {
    const cx = L + slot * (i + 0.5), x = cx - bw / 2;
    txt(label, cx, B + 26, 14, 500, C.ink, 'center', out(seg(t, 0.6 + i * 0.08, 1.0 + i * 0.08)));
    const start = 1.1 + i * 0.55, p = out(seg(t, start, start + 0.55));
    if (p <= 0) return;
    const hv = v * p, top = y(hv);
    const last = i === DATA.length - 1;
    ctx.fillStyle = last ? C.bar : mix(C.bar, C.grey, greyP); ctx.fillRect(x, top, bw, B - top);
    txt(hv.toFixed(1), cx, top - 10, 17, 800, C.ink, 'center', clamp(p * 1.6));
  });
  // callout on the last bar: dot, leader line, multiple and the sum behind it
  const a = out(seg(t, 4.9, 5.4));
  if (a > 0) {
    const cx = L + slot * 4.5, top = y(92.4), dx = cx - bw / 2 - 2, dy = top + 3;
    ctx.globalAlpha = a; ctx.strokeStyle = C.ink; ctx.lineWidth = 1.2;
    ctx.beginPath(); ctx.moveTo(dx, dy); ctx.lineTo(dx - 26 * a, dy - 12 * a); ctx.stroke();
    ctx.fillStyle = C.red; ctx.beginPath(); ctx.arc(dx, dy, 4.5, 0, 7); ctx.fill(); ctx.globalAlpha = 1;
    txt('4.6×', dx - 32, dy - 10, 24, 800, C.ink, 'right', a);
    txt('92.4 ÷ 20.1', dx - 32, dy + 12, 14, 500, C.ink, 'right', a);
  }
  txt('Source: made-up figures for illustration only', 45, 520, 14, 400, C.soft, 'left', out(seg(t, 0.6, 1.1)));
  return cv.toDataURL('image/jpeg', 0.94);
}
window.draw = draw; window.DUR = DUR;
document.fonts.load('800 20px Inter').then(() => { window.ready = true; });
</script></body></html>
